<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link
			rel="icon"
			type="image/png"
			sizes="32x32"
			href="./images/favicon-32x32.png"
		/>
		<title>Frontend Mentor | Product preview card component</title>
		<link rel="stylesheet" href="./assets/css/style.css" />
	</head>
	<body>
		<main class="container">
			<article class="product-card">
				<div class="product-image">
					<img
						src="./assets/images/image-product-desktop.jpg"
						alt="Gabrielle Essence Eau De Parfum bottle on white surface with green leaves"
					/>
				</div>
				<section class="product-description">
					<p class="product-category">PERFUME</p>
					<h1 class="product-title">
						Gabrielle Essence Eau De Parfum
					</h1>
					<p class="product-details">
						A floral, solar and voluptuous interpretation composed
						by Olivier Polge, Perfumer-Creator for the House of
						CHANEL.
					</p>
					<div class="product-pricing">
						<p class="product-price">$149.99</p>
						<p class="product-price-before">$169.99</p>
					</div>
					<button
						class="product-btn"
						aria-label="Add Gabrielle Essence Eau De Parfum to cart"
					>
						<span
							><img src="./assets/images/icon-cart.svg" alt=""
						/></span>
						Add to Cart
					</button>
				</section>
			</article>
		</main>

		<footer class="attribution">
			Challenge by
			<a
				href="https://www.frontendmentor.io?ref=challenge"
				target="_blank"
				rel="noopener noreferrer"
				>Frontend Mentor</a
			>. Coded by
			<a
				href="https://github.com/gvillarroel-dev"
				target="_blank"
				rel="noopener noreferrer"
				>Villarroel Giuliana</a
			>.
		</footer>
	</body>
</html>
